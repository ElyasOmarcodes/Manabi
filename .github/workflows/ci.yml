name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Live tests use the shared Gemini key; the free tier allows only a few
  # requests per day, so they run once a day and on demand, not on every push.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  NODE_VERSION: "22"

jobs:
  server:
    name: Server tests (Nusus + pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Unit and API tests (recorded Turath responses)
        run: npm test
      - name: Catalog export is up to date
        run: |
          node scripts/export-catalog.mjs /tmp/catalog.json
          cmp /tmp/catalog.json ../app/assets/catalog/catalog.json
      - name: Dart prompts match the server prompts
        run: python3 tool/sync_prompts.py --check
        working-directory: .
      - name: Docker image builds
        run: docker build -t manabi-server:ci .

  server-live:
    name: Live test (real Turath + Gemini)
    runs-on: ubuntu-latest
    needs: server
    # Spends Gemini quota: only daily and on manual runs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: End-to-end questions against api.turath.io and Gemini
        env:
          GEMINI_API_KYA: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KYA }}
        run: |
          if [ -z "$GEMINI_API_KYA" ]; then
            echo "::warning title=GEMINI_API_KYA missing::The Actions secret GEMINI_API_KYA is not visible to this workflow (Settings → Secrets and variables → Actions → Repository secrets). Live tests skipped."
            exit 0
          fi
          npm run test:live

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  screenshots:
    name: Screenshots (UI + real answers)
    runs-on: ubuntu-latest
    # After the live tests, so the two jobs don't compete for the same Gemini quota.
    needs: [server, flutter, server-live]
    if: >-
      always() && needs.server.result == 'success' && needs.flutter.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' || secrets.GEMINI_API_KYA != '' }}
      # Real answers spend Gemini quota: only daily and on manual runs.
      LIVE_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web app pointing at the local server
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --dart-define=MANABI_SERVER_URL=http://localhost:8787
      - name: Start Manabi server (key from secret, never written to disk)
        working-directory: server
        env:
          GEMINI_API_KYA: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KYA }}
        run: |
          npm ci
          nohup node src/index.mjs > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/api/health && break; sleep 1; done
      - name: Serve web build
        run: |
          nohup python3 -m http.server 8080 --directory app/build/web > web.log 2>&1 &
          sleep 2
      - name: Install Playwright
        working-directory: tool/screenshots
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Capture UI screenshots
        working-directory: tool/screenshots
        run: node shots.mjs http://localhost:8080/ "$GITHUB_WORKSPACE/screenshots" ui
      - name: Real answers need the Gemini key
        if: env.LIVE_RUN == 'true' && env.HAS_GEMINI_KEY != 'true'
        run: echo "::warning title=GEMINI_API_KEY missing::Live answer screenshots skipped – the GEMINI_API_KEY Actions secret is not available."
      - name: Capture real answers (Turath + Gemini)
        if: env.LIVE_RUN == 'true' && env.HAS_GEMINI_KEY == 'true'
        working-directory: tool/screenshots
        env:
          MANABI_SERVER_URL: http://localhost:8787
        run: node shots.mjs http://localhost:8080/ "$GITHUB_WORKSPACE/screenshots" live
      - name: Server log
        if: always()
        run: tail -n 100 server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 30
