<!DOCTYPE html><html><head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Manabi - grounded Islamic research assistant over Turath sources">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Manabi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Manabi · منابع</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start the app's code at once, while the page is still being read. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://api.turath.io" crossorigin>
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0F0F14;
          }
    }
  </style>
  <style id="manabi-loading-style">
    #manabi-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #FFFFFF; color: #6B6880;
      font: 14px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      transition: opacity .25s ease;
    }
    #manabi-loading img { width: 84px; height: 84px; border-radius: 22px; }
    #manabi-loading .bar { width: 160px; height: 4px; border-radius: 4px; background: #ECE9F7; overflow: hidden; }
    #manabi-loading .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #6D4AFF; animation: manabi-slide 1.1s ease-in-out infinite; }
    @keyframes manabi-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-color-scheme: dark) {
      #manabi-loading { background: #0F0F14; color: #A6A3B8; }
      #manabi-loading .bar { background: #24222E; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <!-- Shown at once, in plain HTML, until the app draws its first frame. -->
  <div id="manabi-loading" dir="rtl">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"><i></i></div>
    <div>منابع · بارېږي…</div>
  </div>
  
  
  
  
  <!--

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
