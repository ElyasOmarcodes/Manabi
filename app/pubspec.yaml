name: manabi
description: "Manabi (منابع) – grounded Islamic research assistant over Turath sources."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.1.0
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^13.0.0
  url_launcher: ^6.3.1
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  package_info_plus: ^10.0.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/catalog/
    - assets/images/
    - assets/brand/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/images/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/icon_foreground.png
  web:
    generate: true
    image_path: assets/images/icon.png
    background_color: "#FFFFFF"
    theme_color: "#6C5CE7"
  windows:
    generate: true
    image_path: assets/images/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/icon.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  color_dark: "#0F0F14"
  image_dark: assets/images/splash_logo_dark.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F0F14"
    image: assets/images/splash_android12.png
    image_dark: assets/images/splash_android12.png
  web: true
